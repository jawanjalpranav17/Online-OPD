# Render Blueprint - deploy this repo on Render with one click.
# Render -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: hospital-opd
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
